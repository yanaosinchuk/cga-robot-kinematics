name: verify-full

on:
  push:

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-full]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run full numerical study
        env:
          MPLBACKEND: Agg
        run: python src/generate_figures.py

      - name: Check numerical ledger
        run: git diff --exit-code -- results/results.json results/results.tex

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science

      - name: Compile technical report
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
