name: refresh-audited-artifacts

# Final post-audit rebuild from the orthogonality-audited main branch.

on:
  push:

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-audited-artifacts]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile-check Python sources
        run: python -m compileall -q src projective_geometry tests

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Regenerate full numerical study
        env:
          MPLBACKEND: Agg
        run: python src/generate_figures.py

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science

      - name: Compile technical report
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mv -f main.pdf from_ideal_points_to_robot_joints.pdf

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/results.json results/results.tex figures paper/from_ideal_points_to_robot_joints.pdf
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Refresh audited numerical results, figures, and report [skip ci]"
            git pull --rebase origin main
            git push
          fi
