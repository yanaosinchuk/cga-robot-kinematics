name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile-check Python sources
        run: python -m compileall -q src projective_geometry tests

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Smoke-test reproducibility pipeline
        env:
          FAST: "1"
          OUT_DIR: /tmp/cga-robot-kinematics
          MPLBACKEND: Agg
        run: |
          python src/generate_figures.py
          test -f /tmp/cga-robot-kinematics/results/results.json
          test -f /tmp/cga-robot-kinematics/results/results.tex
          test -f /tmp/cga-robot-kinematics/figures/kinematic_constructions.png
          test -f /tmp/cga-robot-kinematics/figures/stability_analysis.png

      - name: Check numerical invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/cga-robot-kinematics/results/results.json").read_text()
          )

          assert data["projective"]["max"] < 1e-12
          assert data["two_link"]["max"] < 1e-12
          assert data["three_link"]["max"] < 1e-12
          assert data["isosceles"]["mismatch"] == 0
          assert data["tripod"]["residual"] < 1e-12
          assert data["tripod"]["margin_tripod"] < 0.0
          assert data["tripod"]["margin_out"] > 0.0
          assert data["three_link_singularity"]["rev_max"] < 1e-12
          PY
