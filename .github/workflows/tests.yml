name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Smoke-test reproducibility pipeline
        env:
          FAST: "1"
          OUT_DIR: /tmp/cga-robot-kinematics
          MPLBACKEND: Agg
        run: |
          python src/generate_figures.py
          test -f /tmp/cga-robot-kinematics/results/results.json
          test -f /tmp/cga-robot-kinematics/results/results.tex
          test -f /tmp/cga-robot-kinematics/figures/kinematic_constructions.png
          test -f /tmp/cga-robot-kinematics/figures/stability_analysis.png
